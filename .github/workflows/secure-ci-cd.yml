name: Secure CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  security_checks:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install Dependencies
        working-directory: ./laharika-kanchanapalli
        run: pip install -r requirements.txt

      - name: Run Semgrep (SAST)
        uses: returntocorp/semgrep-action@v1

      - name: Run Gitleaks (Secrets Scan)
        uses: gitleaks/gitleaks-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./laharika-kanchanapalli
          push: true
          tags: ghcr.io/laharika08/secure-ci-cd-final-demo:${{ github.sha }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.5.0

      - name: Sign Image
        uses: dodopizza/cosign-sign-push-action@0.0.7
        with:
          image-tags: ghcr.io/laharika08/secure-ci-cd-final-demo:${{ github.sha }}
          image-digest: ${{ steps.build.outputs.digest }}
          cosign-private-key: ${{ secrets.COSIGN_PRIVATE_KEY }}
          cosign-password: ${{ secrets.COSIGN_PASSWORD }}

      - name: Run Trivy Scan
        uses: aquasecurity/trivy-action@0.10.0
        with:
          image-ref: ghcr.io/laharika08/secure-ci-cd-final-demo:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: 1

      - name: Setup Conftest
        uses: princespaghetti/setup-conftest@v1

      - name: Run OPA Policy Check
        run: conftest test config/deployment.yaml --policy policy

  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest
    needs: security_checks

    steps:
      - name: Deployment Placeholder
        run: echo "Deploying securely after all checks passed..."
